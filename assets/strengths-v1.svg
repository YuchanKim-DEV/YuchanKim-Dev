<text x="24.0" y="62" font-size="13" fill="#8B949E">· CPU 200% 쏠림의 원인을 gRPC · L4 분산 구조에서 규명</text>
<text x="24.0" y="84" font-size="13" fill="#8B949E">· 하루 2만 건 누락 → 실시간 재시도로 재발 0건</text>
