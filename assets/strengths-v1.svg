<text x="481.0" y="180" font-size="13" fill="#8B949E">· 운영 DB 락 위험 → 인덱스 대신 전용 테이블로 중복 차단</text>
<text x="481.0" y="202" font-size="13" fill="#8B949E">· 엔진이 문맥을 보도록 연동 단위 변경 → 마스킹 98%</text>
